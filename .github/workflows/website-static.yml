name: Test website hosting
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-workers/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: python ../../scripts/check-seo.py
      - run: node --test ../../tests/*.test.cjs
