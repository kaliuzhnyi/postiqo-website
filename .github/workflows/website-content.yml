name: Test website content

on:
  pull_request:
    paths:
      - "cloudflare-workers/content/**"
      - "blog/**"
      - "assets/css/**"
      - "sitemap.xml"
      - ".github/workflows/website-content.yml"
  push:
    paths:
      - "cloudflare-workers/content/**"
      - "blog/**"
      - "assets/css/**"
      - "sitemap.xml"
      - ".github/workflows/website-content.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-workers/content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
