name: Vehicle cards
on:
  push:
    paths:
      - 'cloudflare-workers/cards/**'
      - 'assets/fonts/**'
      - '.github/workflows/vehicle-cards.yml'
  pull_request:
    paths:
      - 'cloudflare-workers/cards/**'
      - 'assets/fonts/**'
      - '.github/workflows/vehicle-cards.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-workers/cards
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloudflare-workers/cards/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec wrangler deploy --dry-run
